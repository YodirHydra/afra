<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f4;--ink:#4a1f3d;--rose:#e5658b;--lav:#d9c8f5;--gold:#f2b66d;--note:#fff;--soft:#8a5a7c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1226;--ink:#ffe6ee;--rose:#ff8fb0;--lav:#5a3f86;--gold:#f2b66d;--note:#3d1b36;--soft:#d9aac8}}
:root[data-theme="dark"]{--bg:#2a1226;--ink:#ffe6ee;--rose:#ff8fb0;--lav:#5a3f86;--gold:#f2b66d;--note:#3d1b36;--soft:#d9aac8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,.hand{font-family:Caveat,cursive;font-weight:700;line-height:1.05;margin:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
#gate h1{font-size:clamp(3rem,13vw,6rem);color:var(--rose)}
#gate p{margin:0;color:var(--soft);max-width:30ch}
.gift{border:0;background:none;cursor:pointer;font-size:6rem;line-height:1;animation:bob 1.8s ease-in-out infinite}
.gift:focus-visible,.btn:focus-visible{outline:3px solid var(--rose);outline-offset:4px;border-radius:16px}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.gift{animation:none}}
main{max-width:640px;margin:0 auto;padding:40px 20px 80px}
.hero{text-align:center}
.hero h1{font-size:clamp(3rem,12vw,5.2rem);color:var(--rose)}
.hero p{color:var(--soft);margin:8px 0 0}
.polaroid{background:#fff;padding:12px 12px 44px;width:min(82%,340px);margin:28px auto;transform:rotate(-3deg);border-radius:6px;box-shadow:0 14px 34px rgba(74,31,61,.22);position:relative}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px}
.polaroid span{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-size:1.6rem;color:#4a1f3d}
.tape{position:absolute;top:-14px;left:50%;width:90px;height:26px;margin-left:-45px;background:var(--lav);opacity:.9;transform:rotate(4deg);border-radius:3px}
h2{font-size:2.3rem;text-align:center;margin:56px 0 18px;color:var(--rose)}
.notes{display:grid;gap:16px}
.note{background:var(--note);border-radius:18px 18px 18px 4px;padding:18px 20px;box-shadow:0 6px 18px rgba(229,101,139,.15);border-left:6px solid var(--rose)}
.note:nth-child(even){border-left-color:var(--lav);border-radius:18px 18px 4px 18px;transform:translateX(8px)}
.note:nth-child(3n){border-left-color:var(--gold)}
.cake{text-align:center}
.btn{font:700 1.05rem Nunito,sans-serif;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 20px rgba(229,101,139,.35)}
.btn:active{transform:scale(.97)}
#wish{min-height:5.5em;margin:18px 0 0;font-size:1.25rem}
.flame{transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.12,.92) rotate(3deg)}}
.out .flame{display:none}
.sign{text-align:center;margin-top:56px}
.sign .hand{font-size:2.2rem;color:var(--rose)}
</style>
</head>

<script>
// ✏️ Edit these
var NAME="Afra", FROM="Badol", CAPTION="you, being you ✨";
var NOTES=[
 "Online e kotha hoy, tobuo tomar sathe kotha bolle sotti bhalo lage. Eta onek genuine 🌸",
 "Tomar message ashle phone er screen ta ektu beshi bright lage. Screen er opar theke o tumi mood bhalo kore daw ✨",
 "Doori ta amader moddhe shudhu ekta number. Bondhutto te kichu ashe jay na 💕",
 "Ei bochor tomar jonno shudhu bhalo kichu ashuk. Shanti, shafollo, ar onek onek halka hashi.",
 "Pora, kaj, tension sob side e rekhe aaj shudhu enjoy koro. Tumi deserve koro 🎀"
];
var GREET="Happy Birthday, "+NAME+"!";
</script>
<script>
var $=function(i){return document.getElementById(i)};
$("gt").textContent=GREET; $("hb").textContent=GREET; $("cap").textContent=CAPTION; $("from").textContent="— "+FROM+", tomar bondhu 💖";
$("notes").innerHTML=NOTES.map(function(t){var d=document.createElement("div");d.className="note";d.textContent=t;return d.outerHTML}).join("");

var cv=$("fx"),cx=cv.getContext("2d"),parts=[],raf=0,still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function burst(n){if(still)return;var c=["#e5658b","#f2b66d","#d9c8f5","#fff","#f7a8c1"];
 for(var i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:c[i%c.length],a:1});
 if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.008;return p.a>0&&p.y<cv.height+20});
 parts.forEach(function(p){cx.globalAlpha=p.a;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
 raf=parts.length?requestAnimationFrame(loop):0}

$("open").onclick=function(){$("gate").hidden=true;$("card").hidden=false;scrollTo(0,0);burst(160)};
$("blow").onclick=function(){$("cake").classList.add("out");$("blow").disabled=true;
 $("wish").textContent="Wish ta mone mone bole felo… ar dekho, ota sotti hobe 💫";burst(120)};
</script>
